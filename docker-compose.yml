services:
  postgres:
    image: postgres:15-alpine
    container_name: society_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: society_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d society_db"]
      interval: 5s
      timeout: 5s
      retries: 5


  api:
    build: ./backend
    container_name: society_api
    restart: unless-stopped
    ports:
      - "8002:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@postgres:5432/society_db
      - SECRET_KEY=supersecretkeychangeineparation
      - RESEND_API_KEY=re_Ujkg7EUX_GnMD3nes71UksxMsfHyBVRzk
      - EMAIL_FROM=onboarding@resend.dev
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - SUPABASE_STORAGE_BUCKET=${SUPABASE_STORAGE_BUCKET:-complaint-photos}
    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres_data:
